# For Java/Spring Boot projects. Delete this file in TypeScript projects.
name: CI (Java)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs unit + integration tests. Docker is available on ubuntu runners,
      # so Testcontainers works out of the box.
      - name: Build and test
        run: ./mvnw -B verify
